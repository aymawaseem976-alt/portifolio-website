<main>
<section class="container section-box">
  <h2 class="section-title">Contact Me</h2>
  <div class="row g-4">
    <div class="col-12 col-md-5">
      <h5>Get in touch</h5>
      <ul>
        <li>Email: ayma.waseem@example.com</li>
        <li>University: Iqra University</li>
        <li>Location: Islamabad, Pakistan</li>
      </ul>
    </div>
    <div class="col-12 col-md-7">
      <form id="contact-form" action="#" method="post">
        <div class="mb-3"><label for="name" class="form-label">Full Name</label><input type="text" class="form-control" id="name" placeholder="Your name" required></div>
        <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" class="form-control" id="email" placeholder="name@example.com" required></div>
        <div class="mb-3"><label for="service" class="form-label">Service</label>
          <select class="form-select" id="service"><option>Static Website</option><option>Responsive Redesign</option><option>Landing Page</option></select></div>
        <div class="mb-3"><label for="msg" class="form-label">Message</label><textarea class="form-control" id="msg" rows="4" required></textarea></div>
        <button type="submit" class="btn btn-theme w-100">Send Message</button>
      </form>
    </div>
  </div>
</section>
</main>
